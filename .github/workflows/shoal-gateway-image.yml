name: shoal-gateway image

# Builds Dockerfile.shoal-gateway and smoke-tests it (test/container/
# shoal-gateway-smoke.sh): the entrypoint and the non-root account the chart's
# effectsGateways Deployment relies on, and `shoal-gateway grace-period`
# running under a read-only root with every capability dropped.
#
# Nothing is published. Where this image is pushed, and where its base images
# are pulled from (#638), are maintainer decisions this workflow does not make.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shoal-gateway-image.yml"
      - ".dockerignore"
      - "Dockerfile.shoal-gateway"
      - "Makefile"
      - "accumulo/**"
      - "cmd/shoal-gateway/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "pkg/**"
      - "test/container/shoal-gateway-smoke.sh"
      - "wal-quorum-sidecar/go.mod"
      - "wal-quorum-sidecar/go.sum"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/shoal-gateway-image.yml"
      - ".dockerignore"
      - "Dockerfile.shoal-gateway"
      - "Makefile"
      - "accumulo/**"
      - "cmd/shoal-gateway/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "pkg/**"
      - "test/container/shoal-gateway-smoke.sh"
      - "wal-quorum-sidecar/go.mod"
      - "wal-quorum-sidecar/go.sum"

permissions:
  contents: read

concurrency:
  group: shoal-gateway-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and smoke test
        run: |
          make gateway-container-smoke \
            GATEWAY_IMAGE=shoal-gateway:smoke \
            VERSION="${GITHUB_REF_NAME}" \
            REVISION="${GITHUB_SHA}" \
            CREATED="$(git show -s --format=%cI HEAD)"
