apiVersion: v1
kind: Service
metadata:
  name: shoal-read
  labels:
    app.kubernetes.io/name: shoal
    app.kubernetes.io/component: read-fleet
    app.kubernetes.io/part-of: shoal-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shoal
    app.kubernetes.io/component: read-fleet
  ports:
    - name: thrift
      port: 9800
      targetPort: thrift
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoal-read
  labels:
    app.kubernetes.io/name: shoal
    app.kubernetes.io/component: read-fleet
    app.kubernetes.io/part-of: shoal-platform
spec:
  replicas: 3
  # Explicit rollout contract instead of relying on the apps/v1 default
  # (25% maxUnavailable/maxSurge, which round down/up to 0/1 for these 3
  # replicas — spelling it out as maxUnavailable: 0 here pins that exact
  # behavior explicitly rather than leaving it to rounding). Keeps all 3
  # replicas serving throughout a rollout: an old replica is never
  # removed until the one extra (maxSurge: 1) surge pod has passed
  # readiness, since the controller isn't allowed any unavailable pods in
  # between.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shoal
      app.kubernetes.io/component: read-fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shoal
        app.kubernetes.io/component: read-fleet
        app.kubernetes.io/part-of: shoal-platform
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: shoal
                    app.kubernetes.io/component: read-fleet
                topologyKey: kubernetes.io/hostname
      containers:
        - name: shoal
          image: ghcr.io/example/shoal:dev
          imagePullPolicy: IfNotPresent
          command: ["/shoal"]
          args:
            - -listen=$(SHOAL_THRIFT_LISTEN)
            - -zk=$(SHOAL_ZK)
            - -instance=$(SHOAL_INSTANCE)
            - -accumulo-version=$(SHOAL_ACCUMULO_VERSION)
            - -user=$(SHOAL_METADATA_USER)
            - -storage=$(SHOAL_STORAGE_SCHEME)
            - -cache-bytes=$(SHOAL_CACHE_BYTES)
            - -log-level=$(SHOAL_LOG_LEVEL)
            - -prewarm-tables=$(SHOAL_PREWARM_TABLES)
            - -prewarm-parallelism=$(SHOAL_PREWARM_PARALLELISM)
          envFrom:
            - configMapRef:
                name: shoal-platform-config
          env:
            - name: SHOAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shoal-object-storage-credentials
                  key: accumulo-password
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/shoal/gcs/key.json
          ports:
            - name: thrift
              containerPort: 9800
          volumeMounts:
            - name: object-storage-credentials
              mountPath: /var/run/secrets/shoal/gcs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: thrift
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: thrift
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: object-storage-credentials
          secret:
            secretName: shoal-object-storage-credentials
            optional: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shoal-read
  labels:
    app.kubernetes.io/name: shoal
    app.kubernetes.io/component: read-fleet
    app.kubernetes.io/part-of: shoal-platform
spec:
  # Stateless read replicas spread across nodes (see the pod anti-affinity
  # above): allow one voluntary disruption at a time so at least 2 of 3
  # stay available to serve reads.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shoal
      app.kubernetes.io/component: read-fleet
