apiVersion: v1
kind: Service
metadata:
  name: shoal-embed-headless
  labels:
    app.kubernetes.io/name: shoal-embed
    app.kubernetes.io/component: write-tier
    app.kubernetes.io/part-of: shoal-platform
spec:
  clusterIP: None
  # NOTE: publishNotReadyAddresses keeps every pod's address published in
  # this headless Service's Endpoints/EndpointSlices regardless of
  # readiness, which is what StatefulSet peer-DNS resolution needs during
  # cluster bootstrap/formation. One consequence: shoal-embed's readiness
  # probe (below) cannot use this Service to stop routing traffic to a
  # draining pod the way it could for a normal (non-headless, addresses-
  # filtered) Service -- the probe still gates StatefulSet rollout
  # ordering and gives operators/monitoring an accurate not-ready signal,
  # but per-shard write routing during drain remains the responsibility of
  # whatever owns shard-to-writer assignment (the Accumulo-model
  # manager/coordinator), not this Service. See deploy/README.md.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: shoal-embed
    app.kubernetes.io/component: write-tier
  ports:
    - name: grpc
      port: 9876
      targetPort: grpc
    - name: metrics
      port: 9877
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shoal-embed
  labels:
    app.kubernetes.io/name: shoal-embed
    app.kubernetes.io/component: write-tier
    app.kubernetes.io/part-of: shoal-platform
spec:
  # Scale one StatefulSet per shard. Increase replicas only after the write
  # routing/ownership model for that shard is defined.
  replicas: 1
  serviceName: shoal-embed-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: shoal-embed
      app.kubernetes.io/component: write-tier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shoal-embed
        app.kubernetes.io/component: write-tier
        app.kubernetes.io/part-of: shoal-platform
    spec:
      # shoal-embed serve's defaults are --quiesce-delay=5s (a pause after
      # flipping /readyz to not-ready, before anything stops accepting
      # work) plus --drain-timeout=30s (bounds the drain phase that
      # follows); this leaves headroom for engine close and process exit
      # after both phases end, so SIGKILL doesn't land mid-close.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shoal-embed
          image: ghcr.io/example/shoal:dev
          imagePullPolicy: IfNotPresent
          command: ["/shoal-embed"]
          args:
            - serve
            - --data=$(SHOAL_EMBED_DATA_DIR)
            - --address=0.0.0.0:$(SHOAL_EMBED_GRPC_PORT)
            - --metrics-address=0.0.0.0:$(SHOAL_EMBED_METRICS_PORT)
          envFrom:
            - configMapRef:
                name: shoal-platform-config
          ports:
            - name: grpc
              containerPort: 9876
            - name: metrics
              containerPort: 9877
          volumeMounts:
            - name: data
              mountPath: /var/lib/shoal
            - name: object-storage-credentials
              mountPath: /var/run/secrets/shoal/gcs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: object-storage-credentials
          secret:
            secretName: shoal-object-storage-credentials
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
