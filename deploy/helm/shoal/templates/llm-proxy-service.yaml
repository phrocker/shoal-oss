{{- if eq (include "shoal.llmProxyEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoal.llmProxyName" . }}
  labels:
    {{- include "shoal.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-proxy
  {{- with .Values.llmProxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.llmProxy.service.type }}
  selector:
    {{- include "shoal.llmProxySelectorLabels" . | nindent 4 }}
  # One port, and it is not the health port. The probe surface exists for the
  # kubelet, which reaches the pod directly; publishing it would make an
  # unauthenticated endpoint routable in-cluster for no reason. It is also the
  # one endpoint on this pod that answers without passing through admission, so
  # the fewer things that can reach it, the better.
  ports:
    - name: http
      port: {{ .Values.llmProxy.servicePort }}
      targetPort: http
{{- end }}
